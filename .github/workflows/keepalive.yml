# Keeps the free-tier container awake so nobody waits on a cold start.
#
# Render's free web service sleeps after ~15 minutes idle and the next visitor
# waits 30-60 seconds. A ping every 10 minutes during waking hours prevents that.
#
# Deliberately NOT 24/7: Render's free plan allows 750 instance-hours a month and
# a month is ~730 hours, so running always-on would consume the entire allowance
# and leave nothing spare. 05:00-19:00 UTC covers 10:30-00:30 IST, which is when
# a child might actually practise, and costs about 420 hours a month.
name: keepalive

on:
  schedule:
    - cron: "*/10 5-19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Set the APP_URL repository variable to your deployed URL." >&2
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/health")
          echo "GET $APP_URL/health -> $code"
          [ "$code" = "200" ]
